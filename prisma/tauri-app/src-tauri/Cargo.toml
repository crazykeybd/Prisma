[package]
name = "prisma"
version = "0.1.0"
description = "Prisma - multi-software automated testing platform"
edition = "2021"

[[bin]]
name = "Prisma"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[profile.release]
strip = true
